http_port 3128

acl allowed_hosts dstdomain "/etc/squid/allowlist.txt"
acl SSL_ports port 443
acl CONNECT method CONNECT

# Only TLS tunnels to allowlisted hosts. No plain HTTP, no other ports, no other hosts.
http_access deny !CONNECT
http_access deny CONNECT !SSL_ports
http_access allow CONNECT allowed_hosts
http_access deny all

cache deny all
cache_mem 0 MB
access_log stdio:/dev/stdout
cache_log /dev/stderr
logfile_rotate 0
pid_filename none
coredump_dir /tmp
